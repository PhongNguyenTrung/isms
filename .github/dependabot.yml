version: 2
updates:
  # ---------------------------------------------------------------------------
  # Backend microservices — npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/services/auth-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/ordering-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/kitchen-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/iot-gateway"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/inventory-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/notification-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/services/analytics-service"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # Frontend applications — npm
  # Grouped so tightly-coupled packages (react/react-dom, vite/plugin-react,
  # radix-ui/*, tailwind/postcss) move together in a single PR.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend/tablet-app"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  - package-ecosystem: "npm"
    directory: "/frontend/manager-dashboard"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "tailwindcss-*"
          - "@tailwindcss/*"
          - "postcss"
          - "postcss-*"
          - "autoprefixer"

  # ---------------------------------------------------------------------------
  # Container base images — Docker
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/services/auth-service"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/services/ordering-service"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/services/kitchen-service"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/services/iot-gateway"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/services/inventory-service"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/services/notification-service"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/services/analytics-service"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/frontend/tablet-app"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"
    directory: "/frontend/manager-dashboard"
    schedule: { interval: "monthly" }

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
