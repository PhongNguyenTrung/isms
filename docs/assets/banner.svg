<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="IRMS — Intelligent Restaurant Management System">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <circle cx="600" cy="150" r="220" fill="url(#glow)"/>

  <!-- Decorative grid dots -->
  <g fill="#fbbf24" opacity="0.18">
    <circle cx="60"   cy="40"  r="1.5"/>
    <circle cx="120"  cy="70"  r="1.5"/>
    <circle cx="180"  cy="30"  r="1.5"/>
    <circle cx="240"  cy="60"  r="1.5"/>
    <circle cx="80"   cy="240" r="1.5"/>
    <circle cx="160"  cy="260" r="1.5"/>
    <circle cx="220"  cy="225" r="1.5"/>
    <circle cx="970"  cy="40"  r="1.5"/>
    <circle cx="1030" cy="65"  r="1.5"/>
    <circle cx="1090" cy="35"  r="1.5"/>
    <circle cx="1140" cy="70"  r="1.5"/>
    <circle cx="990"  cy="245" r="1.5"/>
    <circle cx="1060" cy="225" r="1.5"/>
    <circle cx="1130" cy="255" r="1.5"/>
  </g>

  <!-- Subtle event-flow lines across background -->
  <g stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.12">
    <path d="M 0,80 C 300,40 900,260 1200,220"/>
    <path d="M 0,220 C 300,260 900,40 1200,80"/>
  </g>

  <!-- LEFT: Chef hat + plate + utensils -->
  <g transform="translate(140, 150)" filter="url(#softShadow)">

    <!-- Plate (ellipse with rim) -->
    <ellipse cx="0" cy="55" rx="72" ry="14" fill="#f8fafc"/>
    <ellipse cx="0" cy="53" rx="64" ry="10" fill="#e2e8f0"/>
    <ellipse cx="-18" cy="51" rx="14" ry="3" fill="#cbd5e1" opacity="0.6"/>

    <!-- Fork (tilted left) -->
    <g transform="translate(-44, -8) rotate(-18)">
      <rect x="-2"  y="0"  width="4"  height="74" rx="2" fill="#f1f5f9"/>
      <rect x="-9"  y="-2" width="3"  height="22" rx="1.5" fill="#f1f5f9"/>
      <rect x="-3.5" y="-2" width="3" height="22" rx="1.5" fill="#f1f5f9"/>
      <rect x="2"   y="-2" width="3"  height="22" rx="1.5" fill="#f1f5f9"/>
      <rect x="7.5" y="-2" width="3"  height="22" rx="1.5" fill="#f1f5f9"/>
      <rect x="-10" y="18" width="20" height="4"  rx="1.5" fill="#f1f5f9"/>
    </g>

    <!-- Knife (tilted right) -->
    <g transform="translate(44, -8) rotate(18)">
      <rect x="-2" y="20" width="4" height="54" rx="2" fill="#f1f5f9"/>
      <path d="M -6,-6 L 6,-6 L 8,22 L -8,22 Z" fill="#f1f5f9"/>
    </g>

    <!-- Chef hat -->
    <g transform="translate(0, -70)">
      <rect x="-32" y="-2" width="64" height="14" rx="3" fill="#f8fafc"/>
      <path d="M -32,-2 Q -42,-30 -18,-36 Q -14,-58 0,-58 Q 14,-58 18,-36 Q 42,-30 32,-2 Z" fill="#f8fafc"/>
      <circle cx="-14" cy="-28" r="9" fill="#f1f5f9"/>
      <circle cx="0"   cy="-42" r="11" fill="#f1f5f9"/>
      <circle cx="16"  cy="-30" r="9" fill="#f1f5f9"/>
    </g>

    <!-- Steam puffs above hat -->
    <g opacity="0.55" fill="#fef3c7">
      <path d="M -10,-140 Q -14,-128 -6,-122 Q 2,-118 -2,-130 Z"/>
      <path d="M 8,-150 Q 4,-138 12,-132 Q 20,-128 16,-140 Z"/>
    </g>
  </g>

  <!-- CENTER: Title & tagline -->
  <g text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="138" font-size="92" font-weight="900" fill="url(#titleGrad)" letter-spacing="-3">IRMS</text>
    <text x="600" y="183" font-size="22" font-weight="600" fill="#ffffff" opacity="0.97">Intelligent Restaurant Management System</text>
    <text x="600" y="215" font-size="13" font-weight="500" fill="#fdba74" letter-spacing="5">IoT  •  MICROSERVICES  •  EVENT-DRIVEN</text>

    <!-- Decorative underline -->
    <line x1="510" y1="153" x2="690" y2="153" stroke="url(#titleGrad)" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- RIGHT: IoT signal + sensor mesh -->
  <g transform="translate(1050, 150)" filter="url(#softShadow)">

    <!-- Sensor mesh nodes -->
    <g fill="#fbbf24">
      <circle cx="-58" cy="60"  r="3.5"/>
      <circle cx="-32" cy="70"  r="3.5"/>
      <circle cx="0"   cy="64"  r="3.5"/>
      <circle cx="32"  cy="70"  r="3.5"/>
      <circle cx="58"  cy="60"  r="3.5"/>
    </g>

    <!-- Mesh links -->
    <g stroke="#fbbf24" stroke-width="1" opacity="0.45">
      <line x1="-58" y1="60" x2="0" y2="20"/>
      <line x1="-32" y1="70" x2="0" y2="20"/>
      <line x1="0"   y1="64" x2="0" y2="20"/>
      <line x1="32"  y1="70" x2="0" y2="20"/>
      <line x1="58"  y1="60" x2="0" y2="20"/>
    </g>

    <!-- Hub / gateway node -->
    <circle cx="0" cy="20" r="13" fill="#ffffff"/>
    <circle cx="0" cy="20" r="8"  fill="#ea580c"/>
    <circle cx="0" cy="20" r="3"  fill="#fef3c7"/>

    <!-- WiFi arcs (signal upward) -->
    <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M -22,2 Q 0,-16 22,2"   opacity="0.9"/>
      <path d="M -38,-12 Q 0,-44 38,-12" opacity="0.65"/>
      <path d="M -54,-26 Q 0,-72 54,-26" opacity="0.4"/>
    </g>
  </g>
</svg>
